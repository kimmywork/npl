id: scheme-no-long-as-i64-in-c-structs
language: scheme
severity: error
message: "Do not hardcode C 'long'/'unsigned long' to 64-bit type codes (7/3) in c-struct-type-code."
note: >-
  On Windows (LLP64), C 'long' is 32 bits (signed 6, unsigned 2), whereas on
  LP64 Unix it is 64 bits (signed 7, unsigned 3). Dispatch on
  (npl_platform_feature \"windows\").
files:
  - src/compiler/frontend/c-structs.npl
rule:
  any:
    - pattern: ((string=? $NAME $TYPE) 7)
    - pattern: ((string=? $NAME $TYPE) 3)
  has:
    kind: string
    regex: '^"(unsigned )?long"$'
    stopBy: end
