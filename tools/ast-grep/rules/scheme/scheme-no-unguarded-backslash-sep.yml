id: scheme-no-unguarded-backslash-sep
language: scheme
severity: error
message: "Recognize backslash (byte 92 or #\\\\) as a path separator only on Windows."
note: >-
  On Linux, '\\' is a legal filename character, not a directory separator. Gate
  backslash checks behind (npl_platform_feature \"windows\"),
  (platform-feature? 'windows), or (cond-expand (windows ...)).
files:
  - src/**/*.npl
  - lib/**/*.sld
  - lib/**/*.scm
ignores:
  - src/compiler/reader/lexer.npl
  - src/compiler/backend/c-stubs.npl
  - src/compiler/tests/**
  - tests/**
rule:
  any:
    - pattern: (= $BYTE 92)
    - all:
        - pattern: (char=? $CH $LIT)
        - has:
            kind: character
            regex: '^#\\\\$'
            stopBy: end
  not:
    inside:
      kind: list
      has:
        kind: symbol
        regex: ^(npl_platform_feature|platform-feature\?|cond-expand)$
        stopBy: end
      stopBy: end
