id: scheme-no-unguarded-backslash-sep
language: scheme
severity: error
message: "Recognize backslash (byte 92) as a path separator only on Windows."
note: >-
  On Linux, '\\' is a legal filename character, not a directory separator. Gate
  backslash separator checks behind (npl_platform_feature \"windows\") or
  (platform-feature? 'windows).
files:
  - src/compiler/driver*.npl
  - src/compiler/frontend/source.npl
  - src/compiler/frontend/library.npl
  - src/repl/main.npl
  - lib/npl/native.sld
rule:
  pattern: (= $BYTE 92)
  not:
    inside:
      kind: list
      has:
        kind: symbol
        regex: ^(npl_platform_feature|platform-feature\?)$
        stopBy: end
      stopBy: end
