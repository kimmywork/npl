id: c-no-unguarded-stack-high-clamp
language: c
severity: error
message: "Do not compare or clamp stack bounds against stack_high outside #ifdef _WIN32."
note: >-
  On Unix, stack_high is only the init marker rather than the OS stack limit, so
  comparing/clamping against it truncates older host frames (e.g. trampoline
  re-entry). Restrict stack_high bound checks to #ifdef _WIN32 where
  GetCurrentThreadStackLimits provides an authoritative bound.
files:
  - runtime/**/*.c
rule:
  kind: binary_expression
  all:
    - has:
        regex: ^(>|<|>=|<=)$
    - has:
        kind: field_expression
        has:
          field: field
          kind: field_identifier
          regex: ^stack_high$
  not:
    inside:
      kind: preproc_ifdef
      stopBy: end
