id: c-no-narrow-win32-rmdir
language: c
severity: error
message: "Do not call narrow _rmdir() on Windows; use npl_win32_rmdir() with UTF-16 _wrmdir()."
note: >-
  Narrow _rmdir() decodes UTF-8 paths with the active Windows code page and fails
  on non-ASCII paths (e.g. café). Use npl_win32_rmdir() from runtime/os-win32.h.
files:
  - runtime/**/*.c
  - lib/**/*.c
rule:
  kind: call_expression
  has:
    field: function
    kind: identifier
    regex: ^_rmdir$
