id: c-no-unguarded-posix-runtime-call
language: c
severity: error
message: "Guard POSIX-only runtime APIs with #ifdef/#ifndef _WIN32."
note: >-
  runtime/ builds on both POSIX and native Windows (CLANG64). Provide a Win32
  alternative inside an #ifdef _WIN32 / #else block before calling POSIX-only
  APIs (posix_memalign, alarm, pipe, mmap, munmap, fork, execv*, waitpid, poll,
  dlopen, dlsym, mkdtemp, realpath, readlink).
files:
  - runtime/**/*.c
rule:
  kind: call_expression
  has:
    field: function
    kind: identifier
    regex: ^(posix_memalign|alarm|pipe|mmap|munmap|fork|execvp|execv|waitpid|poll|dlopen|dlsym|mkdtemp|realpath|readlink)$
  not:
    inside:
      any:
        - kind: preproc_ifdef
        - kind: preproc_else
        - kind: preproc_if
      stopBy: end
