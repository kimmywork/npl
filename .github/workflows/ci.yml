name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gate:
    name: Linux gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      NPL_TEST_LC_ALL: C.UTF-8

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang file guile-3.0 python3

      - name: Run the repository gate
        run: ./tools/run_tests.sh --skip-current-fixed-point
