name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gate:
    name: Linux gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      NPL_TEST_LC_ALL: C.UTF-8

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang file guile-3.0 python3

      - name: Run the repository gate
        run: ./tools/run_tests.sh --skip-current-fixed-point

  ast-grep-lint:
    name: AST lint (C & Scheme)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.51.3

      - name: Build tree-sitter-scheme parser
        run: ./tools/ast-grep/setup.sh

      - name: Run ast-grep rule tests and repository scan
        run: ./tools/ast-grep/lint.sh --format github
